<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>전체 글 — 가장 보통의 매거진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Noto+Serif+KR:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="archive">
<div class="wrap">
<div id="site-header"></div>
<main>
  <section class="page-head">
    <p class="eyebrow">ARCHIVE</p>
    <h1>전체 <b>글</b></h1>
    <div class="arc-bar">
      <p class="lede">가장 보통의 매거진의 발행글입니다.</p>
      <label class="sort"><span class="sr">정렬</span>
        <select id="sort" aria-label="정렬">
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="pop">인기순</option>
        </select>
      </label>
    </div>
  </section>
  <ul class="issues" id="all"></ul>
</main>
<div id="site-footer"></div>
</div>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var S = window.SITE, ul = document.getElementById("all"), sel = document.getElementById("sort");
  var counts = {}, loaded = false;
  function draw() {
    var total = S.POSTS.length;
    // 번호는 발행 순서(가장 오래된 글이 001)로 매긴다. 맨 위 최신 글 번호가 위쪽 LATEST 번호와 같다.
    var rows = S.POSTS.map(function (p, i) { return { p: p, no: total - i, n: counts[p.id] || 0, i: i }; });
    if (sel.value === "old") rows.reverse();
    else if (sel.value === "pop") rows.sort(function (a, b) { return b.n - a.n || a.i - b.i; });
    ul.textContent = "";
    rows.forEach(function (r) { ul.appendChild(S.issueRow(r.p, r.no)); });
  }
  S.ready.then(function () {
    draw();
    S.readCounts().then(function (c) { counts = c || {}; loaded = true; if (sel.value === "pop") draw(); });
  });
  sel.addEventListener("change", draw);
})();
</script>
</body>
</html>
