<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>분야별 글 — 가장 보통의 매거진</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@400;500&family=Noto+Serif+KR:wght@300;400;600&family=Noto+Sans+KR:wght@300;400;500&display=swap">
<link rel="stylesheet" href="site.css">
</head>
<body data-page="category">
<div class="wrap">
<div id="site-header"></div>
<main>
  <section class="page-head">
    <p class="eyebrow">CATEGORY</p>
    <h1>분야별 <b>글</b></h1>
    <div class="arc-bar">
      <p class="lede">분야를 선택하여 읽을 수 있습니다.</p>
      <label class="sort"><span class="sr">정렬</span>
        <select id="sort" aria-label="정렬">
          <option value="new">최신순</option>
          <option value="old">오래된순</option>
          <option value="pop">인기순</option>
        </select>
      </label>
    </div>
    <div class="tabs" id="tabs" role="group" aria-label="분야 선택"></div>
  </section>
  <ul class="issues" id="grid"></ul>
</main>
<div id="site-footer"></div>
</div>
<script src="config.js"></script>
<script src="site.js"></script>
<script>
(function () {
  var S = window.SITE, current = "전체", counts = {};
  var tabs = document.getElementById("tabs"), grid = document.getElementById("grid"), sel = document.getElementById("sort");
  function draw() {
    tabs.textContent = "";
    ["전체"].concat(S.CATS).forEach(function (c) {
      var b = S.el("button", "tab", c);
      b.type = "button";
      b.setAttribute("aria-pressed", c === current ? "true" : "false");
      b.addEventListener("click", function () { current = c; draw(); });
      tabs.appendChild(b);
    });
    grid.textContent = "";
    // 번호는 전체 글과 같은 발행 순서 번호다.
    var total = S.POSTS.length;
    var rows = S.POSTS.map(function (p, i) { return { p: p, no: total - i, n: counts[p.id] || 0, i: i }; })
      .filter(function (r) { return current === "전체" || r.p.cat === current; });
    if (sel.value === "old") rows.reverse();
    else if (sel.value === "pop") rows.sort(function (a, b) { return b.n - a.n || a.i - b.i; });
    if (!rows.length) { grid.appendChild(S.el("li", "empty", "이 분야의 글은 아직 없습니다.")); return; }
    rows.forEach(function (r) { grid.appendChild(S.issueRow(r.p, r.no)); });
  }
  S.ready.then(function () {
    draw();
    S.readCounts().then(function (c) { counts = c || {}; if (sel.value === "pop") draw(); });
  });
  sel.addEventListener("change", draw);
})();
</script>
</body>
</html>
